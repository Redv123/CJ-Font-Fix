name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check browser test types
        run: npm run typecheck:sites
      - name: Build extension
        run: npm run build
      - name: Package extension
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./manifest.json").version')"
          package_version="$(node -p 'require("./package.json").version')"
          [[ "$version" == "$package_version" ]] || {
            echo "manifest.json and package.json versions differ" >&2
            exit 1
          }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          tag="v$version"
          notes="docs/releases/$tag.md"
          test -f "$notes" || {
            echo "Missing release notes: $notes" >&2
            exit 1
          }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || {
              echo "Tag $GITHUB_REF_NAME does not match $tag" >&2
              exit 1
            }
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual releases must run from main" >&2
            exit 1
          fi

          test -f dist/manifest.json
          test -f dist/content.js
          test -f dist/background.js
          test -f dist/LICENSE
          test ! -e dist/docs
          test ! -e dist/README.md
          test ! -e dist/README.zh-CN.md
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Source maps must not be included in the release ZIP" >&2
            exit 1
          fi

          archive="cj-font-fallback-fix-$version.zip"
          (cd dist && zip -q -r "../$archive" .)
          unzip -t "$archive"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "CJ Font Fallback Fix $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES"
          else
            if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
              echo "Tag $RELEASE_TAG already exists; refusing to attach a build from a different commit" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "CJ Font Fallback Fix $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES"
          fi
